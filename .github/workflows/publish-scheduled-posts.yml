# 예약 발행
#
# 5분마다 "올릴 때가 된 글"이 있는지 확인하고 발행한다.
#
# 필요한 시크릿은 토큰 갱신 워크플로와 같다 (APP_URL, CRON_SECRET).
# 이미 넣어두었다면 추가 설정 없이 바로 동작한다.
#
# 참고: GitHub의 예약 실행은 정시가 아니라 몇 분 늦을 수 있다.
# 스레드 글 발행에는 문제가 없는 수준이지만, 초 단위 정확도가 필요하면
# Vercel Pro로 옮겨야 한다.
name: 예약 발행

on:
  schedule:
    - cron: '*/5 * * * *'
  # 탭에서 버튼으로 즉시 실행. 예약을 걸어두고 바로 확인할 때 쓴다.
  workflow_dispatch:

# 앞선 실행이 아직 돌고 있으면 겹쳐 돌리지 않는다.
# (같은 글이 두 번 올라가는 것을 막는 1차 방어선. 2차는 DB 잠금이다)
concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 발행 요청
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::APP_URL 또는 CRON_SECRET 시크릿이 비어 있습니다."
            echo "저장소 Settings > Secrets and variables > Actions 에서 넣어주세요."
            exit 1
          fi

          # 재시도는 하지 않는다. 응답이 늦어 재요청하면 같은 글을 두 번
          # 올릴 위험이 있고, 어차피 5분 뒤에 다시 돈다.
          status=$(curl --silent --show-error \
            --connect-timeout 15 --max-time 240 \
            --output response.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/publish-scheduled")

          echo "HTTP ${status}"
          cat response.json
          echo

          if [ "${status}" != "200" ]; then
            echo "::error::예약 발행 실패 (HTTP ${status}). 위 응답을 확인하세요."
            exit 1
          fi
